[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "velixar-cli"
version = "0.2.0"
description = "Velixar Memory API — CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Velixar AI" }]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "requests>=2.28",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[tool.setuptools]
# All modules shipped.
py-modules = ["velixar_cli", "velixar_vou", "velixar_foundry", "velixar_foundry_http", "velixar_foundry_catalog", "velixar_foundry_run", "velixar_foundry_resources"]

[project.scripts]
velixar = "velixar_cli:cli"

[project.urls]
Homepage = "https://velixarai.com"
Documentation = "https://docs.velixarai.com"
Repository = "https://github.com/VelixarAi/velixar-cli"
