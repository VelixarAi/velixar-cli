[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "velixar-cli"
version = "0.2.0"
description = "Velixar Memory API — CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Velixar AI" }]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "requests>=2.28",
]

[tool.setuptools]
# Both modules are shipped. Auto-discovery finds a single top-level module in a
# flat layout but is not guaranteed to pick up a second one, and a CLI that
# installs without its own `vou` command would fail only for users, never in dev.
py-modules = ["velixar_cli", "velixar_vou"]

[project.scripts]
velixar = "velixar_cli:cli"

[project.urls]
Homepage = "https://velixarai.com"
Documentation = "https://docs.velixarai.com"
Repository = "https://github.com/VelixarAi/velixar-cli"
